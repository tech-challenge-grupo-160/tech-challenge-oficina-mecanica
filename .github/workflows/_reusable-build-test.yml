name: Reusable — Build and Test

on:
  workflow_call:
    inputs:
      dotnet-version:
        required: false
        type: string
        default: '10.0.300'
      solution-file:
        required: false
        type: string
        default: 'Fiap.TechChallenge.OficinaMecanica.slnx'
      run-integration-tests:
        description: 'Executa testes de integração (requer Docker)'
        required: false
        type: boolean
        default: true
    outputs:
      build-success:
        description: 'Build concluído com sucesso'
        value: ${{ jobs.build-and-test.outputs.success }}

env:
  UNIT_TEST_PROJECT: 'tests/Fiap.TechChallenge.OficinaMecanica.Test.UnitTests/Fiap.TechChallenge.OficinaMecanica.Test.UnitTests.csproj'
  INTEGRATION_TEST_PROJECT: 'tests/Fiap.TechChallenge.OficinaMecanica.Test.IntegrationTests/Fiap.TechChallenge.OficinaMecanica.Test.IntegrationTests.csproj'
  POSTGRES_TEST_IMAGE: 'postgres:16-alpine'

jobs:
  build-and-test:
    name: Build and Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      success: ${{ steps.set-output.outputs.success }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ inputs.dotnet-version }}

      - name: Restore dependencies
        run: dotnet restore ${{ inputs.solution-file }}

      - name: Build solution
        run: >
          dotnet build ${{ inputs.solution-file }}
          --configuration Release
          --no-restore

      - name: Run unit tests
        run: >
          dotnet test ${{ env.UNIT_TEST_PROJECT }}
          --configuration Release
          --no-build
          --no-restore
          --verbosity normal

      - name: Pull PostgreSQL test image
        if: ${{ inputs.run-integration-tests }}
        run: docker pull ${{ env.POSTGRES_TEST_IMAGE }}

      - name: Run integration tests
        if: ${{ inputs.run-integration-tests }}
        timeout-minutes: 10
        run: >
          dotnet test ${{ env.INTEGRATION_TEST_PROJECT }}
          --configuration Release
          --no-build
          --no-restore
          --verbosity normal

      - name: Show Docker diagnostics on failure
        if: failure()
        run: |
          docker ps -a
          docker images

      - name: Set success output
        id: set-output
        run: echo "success=true" >> $GITHUB_OUTPUT

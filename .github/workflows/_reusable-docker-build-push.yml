name: Reusable — Docker Build & Push

on:
  workflow_call:
    inputs:
      image-tag:
        description: 'Tag da imagem (ex: develop-abc1234, v1.0.0)'
        required: true
        type: string
      push:
        description: 'Faz push para o GHCR'
        required: false
        type: boolean
        default: true
    outputs:
      image-name:
        description: 'Nome completo da imagem com tag'
        value: ${{ jobs.docker.outputs.image-name }}

permissions:
  contents: read
  packages: write   # necessário para push no GHCR

jobs:
  docker:
    name: Docker Build & Push
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      image-name: ${{ steps.meta.outputs.tags }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Login no GHCR usando o token automático do GitHub Actions.
      # Não precisa de nenhum secret adicional.
      - name: Log in to GitHub Container Registry
        if: ${{ inputs.push }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Gera os metadados de tags e labels seguindo as convenções OCI.
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/fiap-techchallenge-oficina-mecanica-api
          tags: |
            type=raw,value=${{ inputs.image-tag }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/backend/Dockerfile
          push: ${{ inputs.push }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Cache entre execuções: economiza ~2-3 min por build
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image digest
        run: echo "Imagem publicada com tag ${{ inputs.image-tag }}"

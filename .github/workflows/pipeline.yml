# CI/CD do servico: chama o pipeline reutilizavel do tech-challenge-pipelines
# (F4-08). Substitui o deploy-eks.yml e o pr-develop-ci.yml. PR roda so build e testes; push na homolog/master publica
# no ambiente da branch; o disparo manual publica no ambiente escolhido - e
# assim que se publica em dev.
name: Pipeline

on:
  pull_request:
    branches: [develop, homolog, master]
  push:
    branches: [homolog, master]
  workflow_dispatch:
    inputs:
      ambiente:
        description: "Ambiente de destino"
        type: choice
        options: [desenvolvimento, homologacao, producao]
        default: desenvolvimento

permissions:
  contents: read

jobs:
  pipeline:
    name: Pipeline
    uses: tech-challenge-grupo-160/tech-challenge-pipelines/.github/workflows/servico-dotnet.yml@v1
    with:
      servico: oficina-mecanica-api
      solucao: Fiap.TechChallenge.OficinaMecanica.slnx
      imagem: api
      regiao_aws: ${{ vars.AWS_REGION || 'us-east-1' }}
      ambiente: ${{ github.event_name == 'workflow_dispatch' && inputs.ambiente || (github.event_name == 'push' && (github.ref_name == 'master' && 'producao' || 'homologacao')) || '' }}
      # Os manifests do OS Service ainda vivem no tech-challenge-infra-k8s
      # (overlay k8s/nuvem, tambem usado pelo sobe-tudo.sh).
      manifestos_repositorio: tech-challenge-grupo-160/tech-challenge-infra-k8s
      manifestos_caminho: k8s/nuvem
      # Connection string do RDS e chave do JWT, montadas no api-secret a cada
      # deploy a partir do Secrets Manager (RFC-0002).
      segredos: |
        ConnectionStrings__DefaultConnection=tc-grupo160/{sufixo}/banco#connectionString
        Jwt__SecretKey=tc-grupo160/{sufixo}/jwt-signing-key
        Messaging__Enabled=tc-grupo160/{sufixo}/os/messaging#Messaging__Enabled
        Messaging__ExecucaoCommandQueueUrl=tc-grupo160/{sufixo}/os/messaging#Messaging__ExecucaoCommandQueueUrl
        Messaging__BillingCommandQueueUrl=tc-grupo160/{sufixo}/os/messaging#Messaging__BillingCommandQueueUrl
        Messaging__DiagnosticoIniciadoQueueUrl=tc-grupo160/{sufixo}/os/messaging#Messaging__DiagnosticoIniciadoQueueUrl
        Messaging__DiagnosticoConcluidoQueueUrl=tc-grupo160/{sufixo}/os/messaging#Messaging__DiagnosticoConcluidoQueueUrl
        Messaging__OrcamentoGeradoQueueUrl=tc-grupo160/{sufixo}/os/messaging#Messaging__OrcamentoGeradoQueueUrl
        Messaging__OrcamentoAprovadoQueueUrl=tc-grupo160/{sufixo}/os/messaging#Messaging__OrcamentoAprovadoQueueUrl
        Messaging__OrcamentoRecusadoQueueUrl=tc-grupo160/{sufixo}/os/messaging#Messaging__OrcamentoRecusadoQueueUrl
        Messaging__ReservaPecasCommandQueueUrl=tc-grupo160/{sufixo}/os/messaging#Messaging__ReservaPecasCommandQueueUrl
        Messaging__PecasReservadasQueueUrl=tc-grupo160/{sufixo}/os/messaging#Messaging__PecasReservadasQueueUrl
        Messaging__EstoqueInsuficienteQueueUrl=tc-grupo160/{sufixo}/os/messaging#Messaging__EstoqueInsuficienteQueueUrl
        Messaging__IniciarExecucaoCommandQueueUrl=tc-grupo160/{sufixo}/os/messaging#Messaging__IniciarExecucaoCommandQueueUrl
        Messaging__ExecucaoFinalizadaQueueUrl=tc-grupo160/{sufixo}/os/messaging#Messaging__ExecucaoFinalizadaQueueUrl
        Messaging__SolicitarPagamentoCommandQueueUrl=tc-grupo160/{sufixo}/os/messaging#Messaging__SolicitarPagamentoCommandQueueUrl
        Messaging__PagamentoConfirmadoQueueUrl=tc-grupo160/{sufixo}/os/messaging#Messaging__PagamentoConfirmadoQueueUrl
        Messaging__PagamentoRecusadoQueueUrl=tc-grupo160/{sufixo}/os/messaging#Messaging__PagamentoRecusadoQueueUrl
      nome_secret: api-secret
      cluster_autoscaler: true
      # Migrations do EF Core sao codigo gerado: fora da analise e da cobertura.
      sonar_exclusoes: "**/Migrations/**"
    secrets: inherit

  # BDD do fluxo completo da OS (F4-36). Os cenarios tambem rodam no job acima,
  # junto com os testes de integracao e na cobertura; este job existe para
  # publicar o relatorio HTML do Reqnroll, que o pipeline reutilizavel nao
  # publica (ele so sobe os .trx).
  bdd:
    name: BDD - relatorio
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Cenarios BDD (Reqnroll)
        run: |
          dotnet test tests/Fiap.TechChallenge.OficinaMecanica.Test.IntegrationTests \
            --configuration Release --filter "Category=saga" \
            --logger "trx;LogFileName=bdd.trx" --results-directory TestResults

      - name: Resumo dos cenarios
        if: always()
        run: |
          {
            echo "### BDD - fluxo completo da OS"
            echo ""
            echo "| Cenario | Resultado |"
            echo "|---|---|"
            perl -ne 'while (/<UnitTestResult [^>]*testName="([^"]+)"[^>]*outcome="(\w+)"/g) { print "| $1 | $2 |\n" }' TestResults/bdd.trx
            echo ""
            echo "Relatorio HTML no artefato \`relatorio-bdd\` desta execucao."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publicar relatorio
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-bdd
          path: |
            tests/Fiap.TechChallenge.OficinaMecanica.Test.IntegrationTests/bin/Release/net10.0/TestResults/bdd/relatorio-bdd.html
            TestResults/bdd.trx
          if-no-files-found: error

name: PR Develop CI

on:
  pull_request:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_VERSION: '10.0.x'
  BUILD_CONFIGURATION: 'Release'
  SOLUTION_FILE: 'Fiap.TechChallenge.OficinaMecanica.slnx'
  COVERAGE_SETTINGS: 'coverlet.runsettings'
  UNIT_TEST_PROJECT: 'tests/Fiap.TechChallenge.OficinaMecanica.Test.UnitTests/Fiap.TechChallenge.OficinaMecanica.Test.UnitTests.csproj'
  INTEGRATION_TEST_PROJECT: 'tests/Fiap.TechChallenge.OficinaMecanica.Test.IntegrationTests/Fiap.TechChallenge.OficinaMecanica.Test.IntegrationTests.csproj'
  POSTGRES_TEST_IMAGE: 'postgres:16-alpine'

jobs:
  ci:
    name: Build and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Show .NET information
        run: dotnet --info

      - name: Restore dependencies
        run: dotnet restore ${{ env.SOLUTION_FILE }}

      - name: Build solution
        run: >
          dotnet build ${{ env.SOLUTION_FILE }}
          --configuration ${{ env.BUILD_CONFIGURATION }}
          --no-restore

      - name: Run unit tests
        run: >
          dotnet test ${{ env.UNIT_TEST_PROJECT }}
          --configuration ${{ env.BUILD_CONFIGURATION }}
          --no-build
          --no-restore
          --verbosity normal
          --collect:"XPlat Code Coverage"
          --settings ${{ env.COVERAGE_SETTINGS }}
          --logger "trx;LogFileName=unit-tests.trx"
          --results-directory TestResults

      - name: Verify Docker availability
        run: docker info

      - name: Pull PostgreSQL test image
        run: docker pull ${{ env.POSTGRES_TEST_IMAGE }}

      - name: Run integration tests
        timeout-minutes: 10
        run: >
          dotnet test ${{ env.INTEGRATION_TEST_PROJECT }}
          --configuration ${{ env.BUILD_CONFIGURATION }}
          --no-build
          --no-restore
          --verbosity normal
          --collect:"XPlat Code Coverage"
          --settings ${{ env.COVERAGE_SETTINGS }}
          --logger "trx;LogFileName=integration-tests.trx"
          --results-directory TestResults

      - name: Show Docker diagnostics on failure
        if: failure()
        run: |
          docker ps -a
          docker images

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/*.trx
          if-no-files-found: error

      - name: Upload coverage results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-results
          path: TestResults/**/coverage.cobertura.xml
          if-no-files-found: error

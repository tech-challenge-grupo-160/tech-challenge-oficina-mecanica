name: Terraform - mensageria OS Service

on:
  pull_request:
    branches: [develop, homolog, master]
  push:
    branches: [develop, homolog, master]
  workflow_dispatch:
    inputs:
      ambiente:
        description: Ambiente a aplicar
        type: choice
        options: [dev, hom, prod]
        default: dev

permissions:
  contents: read

env:
  TF_VERSION: "1.9.8"
  TF_DIR: infra
  TF_IN_AUTOMATION: "true"

jobs:
  validate:
    name: Format e validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform fmt
        working-directory: ${{ env.TF_DIR }}
        run: terraform fmt -check -recursive -diff

      - name: Terraform init sem backend
        working-directory: ${{ env.TF_DIR }}
        run: terraform init -backend=false

      - name: Terraform validate
        working-directory: ${{ env.TF_DIR }}
        run: terraform validate -no-color

  plan:
    name: Plan (${{ matrix.environment }})
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name == 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        environment: [dev, hom, prod]
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Verificar pre-requisitos do plan
        id: prerequisites
        env:
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        run: |
          if [ -z "$TF_STATE_BUCKET" ] || [ -z "$AWS_ACCESS_KEY_ID" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Plan remoto ignorado: configure TF_STATE_BUCKET e as credenciais AWS temporarias."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Configurar credenciais AWS
        if: steps.prerequisites.outputs.ready == 'true'
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Terraform init
        if: steps.prerequisites.outputs.ready == 'true'
        working-directory: ${{ env.TF_DIR }}
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ matrix.environment }}/messaging-os.tfstate" \
            -backend-config="region=${{ vars.AWS_REGION || 'us-east-1' }}" \
            -backend-config="dynamodb_table=${{ vars.TF_LOCK_TABLE || 'tc-grupo160-tflock' }}"

      - name: Terraform plan
        if: steps.prerequisites.outputs.ready == 'true'
        working-directory: ${{ env.TF_DIR }}
        run: |
          terraform plan -no-color -input=false \
            -var="environment=${{ matrix.environment }}" \
            -var="region=${{ vars.AWS_REGION || 'us-east-1' }}" \
            | sed -E 's/[0-9]{12}/<conta>/g'

  apply:
    name: Apply mensageria
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Resolver ambiente
        id: target
        env:
          EVENT_NAME: ${{ github.event_name }}
          BRANCH: ${{ github.ref_name }}
          INPUT_ENVIRONMENT: ${{ inputs.ambiente }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            TARGET="$INPUT_ENVIRONMENT"
          else
            case "$BRANCH" in
              develop) TARGET=dev ;;
              homolog) TARGET=hom ;;
              master) TARGET=prod ;;
              *) echo "::error::Branch sem ambiente configurado: $BRANCH"; exit 1 ;;
            esac
          fi
          echo "environment=$TARGET" >> "$GITHUB_OUTPUT"

      - name: Exigir configuracao do backend
        env:
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        run: |
          if [ -z "$TF_STATE_BUCKET" ] || [ -z "$AWS_ACCESS_KEY_ID" ]; then
            echo "::error::Configure TF_STATE_BUCKET e as credenciais AWS temporarias antes do apply."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configurar credenciais AWS
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Terraform init
        working-directory: ${{ env.TF_DIR }}
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ steps.target.outputs.environment }}/messaging-os.tfstate" \
            -backend-config="region=${{ vars.AWS_REGION || 'us-east-1' }}" \
            -backend-config="dynamodb_table=${{ vars.TF_LOCK_TABLE || 'tc-grupo160-tflock' }}"

      - name: Terraform apply
        working-directory: ${{ env.TF_DIR }}
        run: |
          terraform apply -auto-approve -input=false \
            -var="environment=${{ steps.target.outputs.environment }}" \
            -var="region=${{ vars.AWS_REGION || 'us-east-1' }}" \
            | sed -E 's/[0-9]{12}/<conta>/g'

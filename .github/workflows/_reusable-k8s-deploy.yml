name: Reusable — Kubernetes Deploy

on:
  workflow_call:
    inputs:
      environment:
        description: 'Nome do ambiente (dev, staging, prod)'
        required: true
        type: string
      image-tag:
        description: 'Tag da imagem Docker a ser deployada'
        required: true
        type: string
      namespace:
        required: false
        type: string
        default: 'oficina-mecanica'
    secrets:
      KUBECONFIG_B64:
        description: 'kubeconfig em base64 de um cluster REMOTO acessível pelo GitHub Actions'
        required: false   # false para não quebrar quando ainda não configurado

jobs:
  deploy:
    name: Deploy — ${{ inputs.environment }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: ${{ inputs.environment }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Verifica se o secret foi configurado E se aponta para um cluster
      # remoto (não localhost). Se não estiver pronto, pula o deploy com aviso.
      - name: Check deploy readiness
        id: check
        run: |
          SECRET="${{ secrets.KUBECONFIG_B64 }}"

          if [ -z "$SECRET" ]; then
            echo "⚠️  Secret KUBECONFIG_B64 não configurado para o ambiente '${{ inputs.environment }}'."
            echo "   Configure em: Settings → Secrets and variables → Actions"
            echo "   O deploy será ignorado até que o secret seja adicionado."
            echo "skip=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Decodifica e verifica se o server aponta para localhost
          DECODED=$(echo "$SECRET" | base64 -d 2>/dev/null || echo "")
          if echo "$DECODED" | grep -qE 'server:\s*https?://(localhost|127\.0\.0\.1)'; then
            echo "⚠️  O kubeconfig aponta para localhost — esse endereço é o cluster kind da"
            echo "   sua máquina local e não é acessível pelo runner do GitHub Actions."
            echo ""
            echo "   Para habilitar o deploy, você precisa de um cluster remoto (EKS, AKS,"
            echo "   GKE, ou qualquer cluster com IP público) e gerar um kubeconfig que"
            echo "   aponte para esse endereço externo."
            echo ""
            echo "   Veja CICD_SETUP.md para instruções de como gerar o secret correto."
            echo "skip=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "skip=false" >> $GITHUB_OUTPUT
          echo "✅ Kubeconfig válido — prosseguindo com o deploy."

      - name: Configure kubectl
        if: steps.check.outputs.skip == 'false'
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBECONFIG_B64 }}" | base64 -d > $HOME/.kube/config
          chmod 600 $HOME/.kube/config

      - name: Verify cluster connection
        if: steps.check.outputs.skip == 'false'
        run: |
          kubectl cluster-info
          kubectl get nodes

      # ── BANCO DE DADOS ──────────────────────────────────────────────
      - name: Apply Namespace
        if: steps.check.outputs.skip == 'false'
        run: kubectl apply -f k8s/namespace.yaml

      - name: Deploy Postgres — ConfigMap
        if: steps.check.outputs.skip == 'false'
        run: kubectl apply -f k8s/postgres/configmap.yaml

      - name: Deploy Postgres — PVC
        if: steps.check.outputs.skip == 'false'
        run: kubectl apply -f k8s/postgres/pvc.yaml

      - name: Deploy Postgres — Deployment
        if: steps.check.outputs.skip == 'false'
        run: kubectl apply -f k8s/postgres/deployment.yaml

      - name: Deploy Postgres — Service
        if: steps.check.outputs.skip == 'false'
        run: kubectl apply -f k8s/postgres/service.yaml

      - name: Wait for Postgres to be Ready
        if: steps.check.outputs.skip == 'false'
        run: |
          kubectl rollout status deployment/postgres \
            -n ${{ inputs.namespace }} \
            --timeout=120s

          kubectl wait pod \
            -n ${{ inputs.namespace }} \
            -l app=postgres \
            --for=condition=Ready \
            --timeout=120s

      # ── APLICAÇÃO ───────────────────────────────────────────────────
      - name: Deploy API — ConfigMap
        if: steps.check.outputs.skip == 'false'
        run: kubectl apply -f k8s/api/configmap.yaml

      - name: Update API image tag
        if: steps.check.outputs.skip == 'false'
        run: |
          IMAGE="ghcr.io/${{ github.repository_owner }}/fiap-techchallenge-oficina-mecanica-api:${{ inputs.image-tag }}"
          echo "Deployando imagem: $IMAGE"
          kubectl set image deployment/oficina-mecanica-api \
            api=$IMAGE \
            -n ${{ inputs.namespace }}

      - name: Deploy API — Deployment
        if: steps.check.outputs.skip == 'false'
        run: kubectl apply -f k8s/api/deployment.yaml

      - name: Deploy API — Service
        if: steps.check.outputs.skip == 'false'
        run: kubectl apply -f k8s/api/service.yaml

      - name: Deploy API — HPA
        if: steps.check.outputs.skip == 'false'
        run: kubectl apply -f k8s/api/hpa.yaml

      - name: Wait for API rollout
        if: steps.check.outputs.skip == 'false'
        run: |
          kubectl rollout status deployment/oficina-mecanica-api \
            -n ${{ inputs.namespace }} \
            --timeout=180s

      # ── HEALTH CHECK ────────────────────────────────────────────────
      - name: Health check
        if: steps.check.outputs.skip == 'false'
        run: |
          kubectl port-forward \
            -n ${{ inputs.namespace }} \
            svc/oficina-mecanica-api 8080:80 &
          PF_PID=$!
          sleep 5

          for i in $(seq 1 12); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/health)
            if [ "$STATUS" = "200" ]; then
              echo "Health check OK (HTTP $STATUS)"
              kill $PF_PID 2>/dev/null || true
              exit 0
            fi
            echo "Tentativa $i/12 — HTTP $STATUS. Aguardando..."
            sleep 5
          done

          echo "Health check falhou após 12 tentativas"
          kill $PF_PID 2>/dev/null || true
          exit 1

      # ── DIAGNÓSTICO EM CASO DE FALHA ────────────────────────────────
      - name: Show diagnostics on failure
        if: failure() && steps.check.outputs.skip == 'false'
        run: |
          echo "=== Pods ==="
          kubectl get pods -n ${{ inputs.namespace }} -o wide

          echo "=== Events ==="
          kubectl get events -n ${{ inputs.namespace }} --sort-by='.lastTimestamp' | tail -20

          echo "=== API logs ==="
          kubectl logs -n ${{ inputs.namespace }} \
            -l app=oficina-mecanica-api \
            --tail=50 || true

          echo "=== Postgres logs ==="
          kubectl logs -n ${{ inputs.namespace }} \
            -l app=postgres \
            --tail=20 || true
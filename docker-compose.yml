services:
  postgres:
    build:
      context: .
      dockerfile: ./docker/postgres/Dockerfile
    image: fiap-techchallenge-oficina-mecanica-postgres:16
    container_name: oficina-mecanica-postgres-dev
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-oficina_mecanica}
      POSTGRES_INITDB_ARGS: "-c max_connections=200"
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - oficina-mecanica-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d oficina_mecanica -h 127.0.0.1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - oficina-mecanica-network-dev
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  api:
    build:
      context: .
      dockerfile: ./docker/backend/Dockerfile
    image: fiap-techchallenge-oficina-mecanica-api:latest
    container_name: oficina-mecanica-api-dev
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: ${API_CONNECTION_STRING:-Host=postgres;Database=oficina_mecanica;Username=postgres;Password=postgres}
      Jwt__SecretKey: ${JWT_SECRET:-local-development-secret}
      Jwt__Issuer: ${JWT_ISSUER:-Fiap.TechChallenge.OficinaMecanica}
      Jwt__Audience: ${JWT_AUDIENCE:-Fiap.TechChallenge.OficinaMecanica}
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - oficina-mecanica-network-dev
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  oficina-mecanica-postgres-data:
    driver: local

networks:
  oficina-mecanica-network-dev:
    driver: bridge

version: '3.8'

services:
  postgres:
    # Substitua 'image' por 'build'
    build:
      context: .
      dockerfile: ./docker/postgres/Dockerfile
    container_name: oficina_postgres_dev
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: oficina_mecanica
      POSTGRES_INITDB_ARGS: "-c max_connections=200"
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d oficina_mecanica -h 127.0.0.1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - oficina_network_dev
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  api:
    build:
      context: .
      dockerfile: ./docker/backend/Dockerfile
    image: oficina-mecanica-api:latest
    container_name: oficina_api_dev
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: oficina_mecanica
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "${API_PORT:-8080}:8080"
    volumes:
      - .:/app/src
      - /app/src/bin
      - /app/src/obj
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - oficina_network_dev
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  postgres_dev_data:
    driver: local

networks:
  oficina_network_dev:
    driver: bridge

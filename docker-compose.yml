services:
  localstack:
    # Ultima linha Community anterior a obrigatoriedade de token nas imagens 2026.
    image: localstack/localstack:4.14.0
    container_name: oficina-mecanica-localstack-dev
    environment:
      SERVICES: sqs,sns,dynamodb
      AWS_DEFAULT_REGION: us-east-1
      DEBUG: "0"
    ports:
      - "4566:4566"
    volumes:
      - ./docker/localstack/init-aws.sh:/etc/localstack/init/ready.d/init-aws.sh
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:4566/_localstack/health"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - oficina-mecanica-network-dev
    restart: unless-stopped

  postgres:
    build:
      context: .
      dockerfile: ./docker/postgres/Dockerfile
    image: fiap-techchallenge-oficina-mecanica-postgres:16
    container_name: oficina-mecanica-postgres-dev
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-oficina_mecanica}
      POSTGRES_INITDB_ARGS: "-c max_connections=200"
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - oficina-mecanica-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d oficina_mecanica -h 127.0.0.1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - oficina-mecanica-network-dev
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  api:
    build:
      context: .
      dockerfile: ./docker/backend/Dockerfile
    image: fiap-techchallenge-oficina-mecanica-api:latest
    container_name: oficina-mecanica-api-dev
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      # A imagem roda com o Datadog Tracer habilitado por padrao, mas o
      # compose local nao sobe um Datadog Agent: sem isso, o tracer fica
      # tentando conectar em um Agent inexistente a cada request.
      DD_TRACE_ENABLED: "false"
      ConnectionStrings__DefaultConnection: ${API_CONNECTION_STRING:-Host=postgres;Database=oficina_mecanica;Username=postgres;Password=postgres}
      Services__Execucao__BaseUrl: ${EXECUCAO_BASE_URL:-http://host.docker.internal:8082}
      Messaging__Enabled: "true"
      Messaging__Region: us-east-1
      Messaging__ServiceUrl: http://host.docker.internal:4566
      AWS_ACCESS_KEY_ID: ${LOCALSTACK_ACCESS_KEY_ID:?Defina LOCALSTACK_ACCESS_KEY_ID no arquivo .env}
      AWS_SECRET_ACCESS_KEY: ${LOCALSTACK_SECRET_ACCESS_KEY:?Defina LOCALSTACK_SECRET_ACCESS_KEY no arquivo .env}
      Messaging__ExecucaoCommandQueueUrl: http://host.docker.internal:4566/000000000000/execucao-iniciar-diagnostico
      Messaging__BillingCommandQueueUrl: http://host.docker.internal:4566/000000000000/billing-gerar-orcamento
      Messaging__DiagnosticoIniciadoQueueUrl: http://host.docker.internal:4566/000000000000/os-diagnostico-iniciado
      Messaging__DiagnosticoConcluidoQueueUrl: http://host.docker.internal:4566/000000000000/os-diagnostico-concluido
      Messaging__OrcamentoGeradoQueueUrl: http://host.docker.internal:4566/000000000000/os-orcamento-gerado
      Messaging__OrcamentoAprovadoQueueUrl: http://host.docker.internal:4566/000000000000/os-orcamento-aprovado
      Messaging__OrcamentoRecusadoQueueUrl: http://host.docker.internal:4566/000000000000/os-orcamento-recusado
      Messaging__ReservaPecasCommandQueueUrl: http://host.docker.internal:4566/000000000000/execucao-reservar-pecas
      Messaging__PecasReservadasQueueUrl: http://host.docker.internal:4566/000000000000/os-pecas-reservadas
      Messaging__EstoqueInsuficienteQueueUrl: http://host.docker.internal:4566/000000000000/os-estoque-insuficiente
      Messaging__IniciarExecucaoCommandQueueUrl: http://host.docker.internal:4566/000000000000/execucao-iniciar-reparo
      Messaging__ExecucaoFinalizadaQueueUrl: http://host.docker.internal:4566/000000000000/os-execucao-finalizada
      Messaging__SolicitarPagamentoCommandQueueUrl: http://host.docker.internal:4566/000000000000/billing-solicitar-pagamento
      Messaging__PagamentoConfirmadoQueueUrl: http://host.docker.internal:4566/000000000000/os-pagamento-confirmado
      Messaging__PagamentoRecusadoQueueUrl: http://host.docker.internal:4566/000000000000/os-pagamento-recusado
      Jwt__SecretKey: ${JWT_SECRET:-local-development-secret-key-32chars}
      Jwt__Issuer: ${JWT_ISSUER:-Fiap.TechChallenge.OficinaMecanica}
      Jwt__Audience: ${JWT_AUDIENCE:-Fiap.TechChallenge.OficinaMecanica}
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy
    networks:
      - oficina-mecanica-network-dev
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  oficina-mecanica-postgres-data:
    driver: local

networks:
  oficina-mecanica-network-dev:
    driver: bridge
